name: Build Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev build-essential curl

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Tauri CLI (Latest Precompiled)
        run: npm install -g @tauri-apps/cli@latest

      - name: Build Tauri Binary
        working-directory: ./src-tauri
        run: tauri build

      - name: Prepare Windows Standalone Portable Binary
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p standalone
          if [ -f src-tauri/target/release/SecuredStorage.exe ]; then
            cp src-tauri/target/release/SecuredStorage.exe standalone/SecuredStorage-Windows-Portable.exe
          elif [ -f src-tauri/target/release/secured-storage.exe ]; then
            cp src-tauri/target/release/secured-storage.exe standalone/SecuredStorage-Windows-Portable.exe
          fi

      - name: Prepare macOS Application Archive
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          mkdir -p standalone
          if [ -d "src-tauri/target/release/bundle/macos/SecuredStorage.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/release/bundle/macos/SecuredStorage.app" "standalone/SecuredStorage-macOS.zip"
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SecuredStorage-${{ matrix.platform }}
          path: |
            standalone/*.exe
            standalone/*.zip
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/SecuredStorage*
            src-tauri/target/release/secured-storage*
          if-no-files-found: warn

      - name: Generate Release Notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 -c "
          import re, os
          ver = '$VERSION'
          notes = ''
          if os.path.exists('CHANGELOG.md'):
              with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                  text = f.read()
              m = re.search(rf'## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=\n## \[|\Z)', text, re.DOTALL)
              if m:
                  notes = m.group(1).strip()
          with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as out:
              if notes:
                  out.write(notes + '\n')
              else:
                  out.write(f'SecuredStorage release v{ver}\n')
          "

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "SecuredStorage ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          files: |
            standalone/*.exe
            standalone/*.zip
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

