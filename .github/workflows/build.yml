name: Build Multi-Platform Binaries

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev build-essential curl

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Tauri CLI (Precompiled)
        run: npm install -g @tauri-apps/cli@^2.0.0

      - name: Build Tauri Binary
        working-directory: ./src-tauri
        run: npx @tauri-apps/cli build

      - name: Prepare Windows Standalone Portable Binary
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p standalone
          if [ -f src-tauri/target/release/SecuredStorage.exe ]; then
            cp src-tauri/target/release/SecuredStorage.exe standalone/SecuredStorage-Windows-Portable.exe
          elif [ -f src-tauri/target/release/secured-storage.exe ]; then
            cp src-tauri/target/release/secured-storage.exe standalone/SecuredStorage-Windows-Portable.exe
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SecuredStorage-${{ matrix.platform }}
          path: |
            standalone/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/SecuredStorage*
            src-tauri/target/release/secured-storage*
          if-no-files-found: warn
